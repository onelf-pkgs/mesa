# Mesa for onelf packages: the GL and Vulkan drivers a host without its
# own reaches at launch, and the build a bundle carries.
#
# The control repository, onelf-pkgs/.github, bumps the sources here when
# upstream releases and resets `release` to 1. Raise `release` by hand
# when the recipe changes and the sources do not. Releases are tagged
# v<mesa version>-<release>.
name = "mesa"
release = 1
arches = ["x86_64", "aarch64"]

[sources.mesa]
version = "26.3.1"
url = "https://archive.mesa3d.org/mesa-{version}.tar.xz"
sha256 = "4e4e438eac7b840a9383988cbb7c08dad8041da544b9319fc26d319fa7348961"
upstream = { gitlab = "gitlab.freedesktop.org/mesa/mesa", tag = "^mesa-([0-9]+\\.[0-9]+\\.[0-9]+)$" }

# Mesa builds its Venus Vulkan driver against this exact release, which
# it no longer carries in its tree. Follow mesa's
# subprojects/venus-protocol.wrap; the control repository leaves it be.
[sources.venus-protocol]
version = "1.1.3"
url = "https://gitlab.freedesktop.org/virgl/venus-protocol/-/archive/v{version}/venus-protocol-v{version}.tar.gz"
sha256 = "c5a362ca28e0a35042db1baeadaf9183500b216841e49d72714b80bae50b4445"
