# Mesa for onelf packages: the GL and Vulkan drivers a host without its
# own reaches at launch, and the build a bundle carries.
#
# The control repository, onelf-pkgs/.github, bumps the sources here when
# upstream releases and resets `release` to 1. Raise `release` by hand
# when the recipe changes and the sources do not. Releases are tagged
# v<mesa version>-<release>.
name = "mesa"
release = 1
arches = ["x86_64", "aarch64"]

[sources.mesa]
version = "26.3.0"
url = "https://archive.mesa3d.org/mesa-{version}.tar.xz"
sha256 = "91d729aa68bb89e4ec857841300bbe922bcb3e52b1f97566ca83930d3b28343a"
upstream = { gitlab = "gitlab.freedesktop.org/mesa/mesa", tag = "^mesa-([0-9]+\\.[0-9]+\\.[0-9]+)$" }
