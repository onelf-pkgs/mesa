name: release

# Copied from onelf-pkgs/.github by its sync workflow, which also pins the
# shared workflow below to the revision it synced from. Edit it there.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  release:
    uses: onelf-pkgs/.github/.github/workflows/pkg-release.yml@2dd1f5549e0c256531ccbe0c3dc42f5267523c8c
    # Exists only in the `release` environment, which main alone may use;
    # the publish job signs self-updates with it.
    secrets:
      ONELF_SIGNING_KEY: ${{ secrets.ONELF_SIGNING_KEY }}
    permissions:
      contents: write
      id-token: write
      attestations: write
